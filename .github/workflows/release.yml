name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build/test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Verify tag matches package version
        run: |
          python -c "import os, tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; t=os.environ['GITHUB_REF_NAME'].removeprefix('v'); print('release tag version:',t,'package version:',v); raise SystemExit(t!=v)"
      - name: Validate release
        run: |
          ruff check src tests deploy
          pytest -q
          python -m build
      - name: Create GitHub Release and attach distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
