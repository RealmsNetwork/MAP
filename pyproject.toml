[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "realmsnetwork-map"
version = "0.2.0"
description = "Model Access Panel (MAP), a multi-panel administrative MCP gateway for authorized Pterodactyl panels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.9,<2",
  "curl-cffi>=0.11,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.31,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/map_server"]
