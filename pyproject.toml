[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "realmsnetwork-map"
version = "0.3.0"
description = "A multi-panel Pterodactyl administration gateway over Model Context Protocol."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["mcp", "model-context-protocol", "pterodactyl", "game-server", "panel", "administration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
authors = [{ name = "RealmsNetwork" }]
dependencies = [
  "mcp[cli]>=1.9,<3",
  "curl-cffi>=0.11,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.31,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]
test = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/RealmsNetwork/MAP"
Repository = "https://github.com/RealmsNetwork/MAP"
Documentation = "https://github.com/RealmsNetwork/MAP/tree/main/docs"
Issues = "https://github.com/RealmsNetwork/MAP/issues"
Changelog = "https://github.com/RealmsNetwork/MAP/blob/main/CHANGELOG.md"

[project.scripts]
map-server = "map_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/map_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
