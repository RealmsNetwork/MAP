[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "realmsnetwork-map"
version = "0.1.0"
description = "Model Access Panel (MAP), a self-hosted MCP gateway for authorized Pterodactyl panels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.9,<2", "curl-cffi>=0.11,<1", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/map_server"]
